# Ba alert theo triệu chứng người dùng thấy (chậm / lỗi / đắt bất thường), không theo
# tên thành phần nội bộ. Ngưỡng bám config/slo.yaml và config/dashboard.yaml.
alerts:
  - name: high_latency_p95
    severity: P2
    condition: 'p95(response_sent.latency_ms) over 5m > 2000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-k4-l3a-alerts'
    owner: phanduybao-oncall
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1

  - name: high_error_rate
    severity: P1
    condition: 'count(request_failed) / count(request_received) * 100 over 5m > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-k4-l3a-alerts'
    owner: phanduybao-oncall
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-2

  - name: cost_per_request_spike
    severity: P3
    condition: 'sum(response_sent.cost_usd) / count(response_sent) over 10m > 0.006'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-k4-l3a-alerts'
    owner: phanduybao-oncall
    slo: guardrails.daily_cost_usd_max
    runbook: docs/alerts.md#alert-3
